<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回忆纸质相册</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0">
<script>
tailwind.config = {
  theme:{
    extend:{
      main:"#3b82f6",
      retroBg:"#e6dfd2",
      retroPaper:"#fff8ec",
      retroText:"#5c4332",
      retroBorder:"#b89c7c"
    },
    fontFamily:{
      sans:['Inter','system-ui','-apple-system','sans-serif'],
      serif:['Georgia','Noto Serif SC','serif']
    }
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh;transition:background 0.45s ease,color 0.45s ease;font-family:system-ui,-apple-system,sans-serif}
/* 两套风格 */
.style-modern{background:#f7f9fc;color:#1f2937}
.style-retro{
  background:#e6dfd2;
  background-image:radial(#d9cebe 0.7px, transparent 0.7px);
  background-size:18px 18px;
  color:#5c4332;
}

/* ========== 真实书本相册核心样式 ========== */
.album-book{
  position:relative;
  perspective:1800px;
  margin-top:2rem;
}
.album-wrap{
  position: relative;
  min-height: 800px;
}
/* 一对翻开的页面（左页+右页，带中间书脊） */
.page-block{
  position:absolute;
  width:100%;
  display:flex;
  justify-content:center;
  gap:0;
  transition:transform 0.6s cubic-bezier(0.2,0,0.2,1.25), opacity 0.6s;
}
.page-hide-left{transform:translateX(-140%);opacity:0}
.page-hide-right{transform:translateX(140%);opacity:0}
.page-show{transform:translateX(0);opacity:1}

/* 单张书页：真实纸张效果 */
.paper-page{
  width:47%;
  padding:2rem;
  position:relative;
  box-shadow: 0 10px 35px rgba(0,0,0,0.13);
}
/* 中间书脊缝隙阴影，模拟书本对折 */
.paper-page[data-side="left"]{
  border-radius:18px 4px 4px 18px;
  box-shadow: -12px 8px 30px rgba(0,0,0,0.12), inset -6px 0 14px rgba(0,0,0,0.06);
}
.paper-page[data-side="right"]{
  border-radius:4px 18px 18px 4px;
  box-shadow: 12px 8px 30px rgba(0,0,0,0.12), inset 6px 0 14px rgba(0,0,0,0.06);
}

.style-modern .paper-page{
  background:#ffffff;
  border:1px solid #e2e8f0;
}
.style-retro .paper-page{
  background:#fff8ec;
  border:2px solid #d4bfaa;
  /* 纸张细微杂色纹理 */
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
}

/* 书页内部照片网格：自动排布，可以放很多照片，自适应 */
.photo-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
  gap:1.4rem;
  margin-top:1rem;
}

/* 照片卡片 相册拍立得质感 */
.photo-card{
  transition:all 0.32s cubic-bezier(0.2,0,0.2,1.3);
  display:flex;
  flex-direction:column;
}
.photo-card:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(0,0,0,0.15)}

.style-modern .photo-card{
  background:#fff;
  border:1px solid #eee;
  border-radius:10px;
  overflow:hidden;
  padding-bottom:0.7rem;
}
.style-retro .photo-card{
  background:#fffdf6;
  /* 拍立得白边效果！真实相册相片白边框 */
  padding:10px;
  box-shadow:0 6px 18px rgba(70,45,20,0.14);
}

.photo-card img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
}
/* 照片下面文字说明 */
.photo-card p{
  margin-top:0.7rem;
  line-height:1.6;
  font-size:0.88rem;
  padding:0 0.4rem;
}
.style-modern .photo-card p{color:#4b5563}
.style-retro .photo-card p{color:#6b4f3e}

/* 标题字体优化 */
h3{font-weight:600;letter-spacing:0.5px}
.style-modern h3{color:#111827}
.style-retro h3{color:#4a3528}

/* 按钮 */
.btn{transition:all 0.25s cubic-bezier(0.2,0,0.2,1.4);border:none;font-weight:500}
.btn:active{transform:scale(0.96)}
#themeBtn{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:0.5rem 1rem;border-radius:999px;font-size:0.9rem}
#themeBtn:hover{filter:brightness(1.05)}
.page-controls button{background:#f3f4f6;color:#1f2937;border-radius:999px;padding:0.45rem 1rem;font-size:0.9rem}
.page-controls button:hover{background:#e5e7eb}
.page-controls input{width:3.5rem;text-align:center;border:1px solid #d1d5db;border-radius:0.5rem;padding:0.4rem;font-size:0.95rem}

/* 右上角时钟 */
.clock-box{position:fixed;top:16px;right:16px;z-50;padding:8px 14px;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0.08);display:flex;gap:8px;align-items:center;font-family:monospace;font-size:14px}
.style-retro .clock-box{background:#fff8ec;border:1px solid #b89c7c}

.split-line{height:1px;width:100%;margin:1.2rem 0}
.style-modern .split-line{background:#e2e8f0}
.style-retro .split-line{background:#b89c7c}

.page-controls{display:flex;align-items:center;gap:0.9rem;flex-wrap:wrap}

/* 小屏幕适配，手机下左右页改成上下堆叠 */
@media(max-width: 900px){
  .page-block{
    flex-direction: column;
    align-items:center;
  }
  .paper-page{
    width:94%;
  }
  .paper-page[data-side="left"]{
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.1);
  }
  .paper-page[data-side="right"]{
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.1);
  }
}
</style>
</head>
<body class="style-modern">
<div class="clock-box">
<i class="fa fa-clock-o text-main"></i>
<span id="clockText"></span>
</div>
<div class="max-w-6xl mx-auto px-4 py-12">
  <div class="flex flex-wrap justify-between items-center mb-10 gap-4">
    <h1 class="text-3xl font-bold">📖 纸质回忆相册</h1>
    <div class="flex gap-3 items-center">
      <button id="themeBtn" class="btn">
        <i class="fa fa-paint-brush mr-1"></i>
        <span id="themeText">复古胶片</span>
      </button>
      <a href="index.html" class="btn px-4 py-2 rounded-lg bg-slate-400 text-white inline-flex items-center gap-1">
        <i class="fa fa-arrow-left"></i> 返回主页
      </a>
    </div>
    <div class="page-controls mt-4">
      <button id="prevBtn" class="btn">
        <i class="fa fa-chevron-left mr-1"></i> 上一页
      </button>
      <span>当前 <input id="pageInput" value="1"> / <span id="totalPage">3</span></span>
      <button id="jumpBtn" class="btn bg-main text-white">跳转</button>
      <button id="nextBtn" class="btn">
        下一页 <i class="fa fa-chevron-right ml-1"></i>
      </button>
    </div>
  </div>
  <div class="album-book">
    <div class="album-wrap" id="albumWrap">
      <!-- JS自动渲染全部书页 -->
    </div>
  </div>
</div>
<script>
// ====================== 【照片配置区，新手只改这里】 ======================
/*
新增一页模板复制：
{
  pageNum:4,
  left:{
    title:"2026.xx.xx · 标题",
    photos:[
      {img:"图片链接", desc:"照片文字"},
      {img:"图片链接", desc:"照片文字"},
      {img:"图片链接", desc:"照片文字"},
    ]
  },
  right:{
    title:"2026.xx.xx · 标题",
    photos:[
      {img:"图片链接", desc:"照片文字"},
      {img:"图片链接", desc:"照片文字"},
      {img:"图片链接", desc:"照片文字"},
      {img:"图片链接", desc:"照片文字"},
    ]
  }
}
*/
const photosData = [
  {
    pageNum:1,
    left:{
      title:"2025.12.12 · 姥姥",
      photos:[
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZSIRqgefCx0z3nFzoyqylA47zQ9Dk6QACrycAAnYcEVQeR68oufkP1T0E.jpg", desc:"午后阳光"},
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXw9qg_OpYC0mkn5CvIjJN8oVukZLkAACaCYAArakIVQdCFrTuLlBwj0E.jpg", desc:"学校旁的教堂"}
      ]
    },
    right:{
      title:"2025.1 · 第一场雪",
      photos:[
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXxBqg_Osk2bo34pSIAmtAkkXHB_8uQACaSYAArakIVTsu88SY98QOT0E.jpg", desc:""},
        {img:"https://picsum.photos/id/1022/600", desc:""}
      ]
    }
  },
  {
    pageNum:2,
    left:{
      title:"2026.08.17 · 手机联机游戏",
      photos:[
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXwABaoPzRfAq1LfWYLbBSIZTCbFA0nkAAlkmAAK2pCFUvjbI85xtMWE9BA.jpg", desc:"木筏求生盗版"},
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXw1qg_Ojy56FkFqWpE1HOnLWhKU3-QACZiYAArakIVQqVtHWLVGRgz0E.jpg", desc:""},
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXwtqg_OcJV9mULcqgwEHi5WzElQDqwACZCYAArakIVQ7cJgGWich5z0E.jpg", desc:""},
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXwxqg_OgaOyfMN9BD7Y2xu7Tp-8DHQACZSYAArakIVTyyYLo9UUr-z0E.jpg", desc:""},
        {img:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZXw5qg_Omk-MAARPQeUwAAdEOWArZskuBAAJnJgACtqQhVJHR60eSizEsPQQ.jpg", desc:"TICK TOCK"}
      ]
    },
    right:{
      title:"2026.07.28 · 郊外花海",
      photos:[
        {img:"https://picsum.photos/id/1048/600", desc:"大片小花铺在田野里，风一吹整片花海摇晃，留住温柔夏日。"}
      ]
    }
  },
  {
    pageNum:3,
    left:{
      title:"2026.08.03 · 晴空云海",
      photos:[
        {img:"https://picsum.photos/id/1060/600/400", desc:"登上高处看见整片云海，云朵层层堆叠，天空干净通透。"}
      ]
    },
    right:{
      title:"2026.08.05 · 城市黄昏",
      photos:[
        {img:"https://picsum.photos/id/1071/600/400", desc:"城市灯光慢慢亮起，黄昏淡紫色天空，平凡日子也有好看瞬间。"}
      ]
    }
  }
];
// ====================== 配置结束，下面逻辑不要修改 ======================

// 渲染书本页面
function renderAlbumHtml(){
  const wrap = document.getElementById("albumWrap");
  wrap.innerHTML = "";
  photosData.forEach(pageItem=>{
    // 渲染左页照片网格
    let leftPhotoHtml = `<div class="photo-grid">`;
    pageItem.left.photos.forEach(p=>{
      leftPhotoHtml += `
      <div class="photo-card">
        <img src="${p.img}">
        <p>${p.desc}</p>
      </div>
      `
    })
    leftPhotoHtml += `</div>`;

    //渲染右页照片网格
    let rightPhotoHtml = `<div class="photo-grid">`;
    pageItem.right.photos.forEach(p=>{
      rightPhotoHtml += `
      <div class="photo-card">
        <img src="${p.img}">
        <p>${p.desc}</p>
      </div>
      `
    })
    rightPhotoHtml += `</div>`;

    const pageDom = document.createElement("div");
    pageDom.className = "page-block";
    pageDom.dataset.page = pageItem.pageNum;
    pageDom.innerHTML = `
        <div class="paper-page" data-side="left">
          <h3>${pageItem.left.title}</h3>
          <div class="split-line"></div>
          ${leftPhotoHtml}
        </div>
        <div class="paper-page" data-side="right">
          <h3>${pageItem.right.title}</h3>
          <div class="split-line"></div>
          ${rightPhotoHtml}
        </div>
    `;
    wrap.appendChild(pageDom);
  })
}

function updateClock(){
  const now = new Date();
  const timeStr = now.toLocaleString("zh-CN",{
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit"
  })
  document.getElementById("clockText").innerText = timeStr;
}
updateClock();
setInterval(updateClock);

// 切换主题
const themeBtn = document.getElementById("themeBtn");
const themeText = document.getElementById("themeText");
themeBtn.onclick = ()=>{
  const body = document.body;
  if(body.classList.contains("style-modern")){
    body.classList.remove("style-modern");
    body.classList.add("style-retro");
    themeText.innerText = "现代样式";
  }else{
    body.classList.remove("style-retro");
    body.classList.add("style-modern");
    themeText.innerText = "复古胶片";
  }
}

renderAlbumHtml();

//分页逻辑
let currentPage = 1;
const allPages = document.querySelectorAll(".page-block");
const totalPageNum = allPages.length;
document.getElementById("totalPage").innerText = totalPageNum;
const pageInput = document.getElementById("pageInput");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const jumpBtn = document.getElementById("jumpBtn");

function renderPage(target){
  if(target < 1 || target > totalPageNum) return;
  allPages.forEach(block=>{
    const pageNum = Number(block.dataset.page);
    block.classList.remove("page-show","page-hide-left","page-hide-right");
    if(pageNum === target){
      block.classList.add("page-show");
    }else if(pageNum < target){
      block.classList.add("page-hide-left");
    }else{
      block.classList.add("page-hide-right");
    }
  })
  currentPage = target;
  pageInput.value = currentPage;
}
prevBtn.onclick = ()=> renderPage(currentPage - 1);
nextBtn.onclick = ()=> renderPage(currentPage + 1);
jumpBtn.onclick = ()=>{
  const num = Number(pageInput.value);
  if(!isNaN(num)) renderPage(num);
}
renderPage(1);
</script>
</body>
</html>
